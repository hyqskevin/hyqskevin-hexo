# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: MonoShow
subtitle: Monologue from Hanamaki
description: Kevin W build this air-castle to collect infos & photos
keywords:
author: Kevin W
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://hyqskevin.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ==========================================================================
# GEO 层：脚本注入
# ==========================================================================
# tools/geo-inject.js 注册 after_render:html 过滤器，给每个页面注入
# canonical、Open Graph 与 JSON-LD 实体图谱（Person / WebSite / Organization / Article）。
#
# 为什么用过滤器而不是改主题 head.pug：
#   · 主题 maupassant-hexo 是独立仓库，同步更新会覆盖 head.pug 的改动
#   · 在 Pug 里内嵌 JSON-LD 极易破坏编译（产物 0 字节且构建不报错）
#
# ⚠️ 注意：这是 Hexo 的 scripts 机制（package.json 的 hexo.scripts），
#    不是 config.inject —— 后者走 injector 机制，要求主题模板里有
#    `<!-- hexo injector head -->` 标记，maupassant 主题没有这个标记。
# scripts/ 目录下的所有脚本会被 Hexo 自动加载（script_dir 默认值）
# tools/geo-inject.js 是同一份文件的副本，改动请同步两边
# 或直接把 scripts/ 作为唯一来源

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ==========================================================================
# GEO 层：sitemap
# ==========================================================================
# 需要 npm install hexo-generator-sitemap（已加入 package.json dependencies）
#
# 为什么必须有 sitemap：
#   · 新鲜度约占 Perplexity 排名的 44.2% 权重
#   · 76.4% 的 Perplexity 引用来自 30 天内更新过的页面
#   · sitemap 的 lastmod 是 AI 判断内容新鲜度的主要依据之一
#
# permalink 的 lastmod 依赖 front-matter 的 updated 字段。
# 建议给重要文章补 updated，Hexo 会自动用它作为 lastmod。
sitemap:
  path: sitemap.xml
  exclude:
    - '404.html'
    - 'archives/index.html'
    - 'categories/index.html'
    - 'tags/index.html'

# ==========================================================================
# GEO 层：permalink 说明
# ==========================================================================
# 当前: :year/:month/:day/:title/
#
# ⚠️ :title 取的是【去掉扩展名的文件名】。若文件名带日期前缀
#    (如 2026-10-18-xxx.md)，URL 会变成
#    /2026/10/17/2026-10-18-xxx/  ← 日期出现两次
#
# 修复方式：用 node tools/fix-permalink-titles.js 剥掉文件名日期前缀，
# 改后 URL 变为 /2026/10/17/xxx/，日期只出现一次且与 front-matter 一致。
#
# ⚠️ 不要改成不带日期的 permalink —— 现有 204 篇文章的 URL 会全部失效，
#    而 GitHub Pages 不支持 301 重定向，会造成大规模死链，是净损失。
# ==========================================================================

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: maupassant

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment.html
deploy:
  type: git
  repo: https://github.com/hyqskevin/hyqskevin.github.io.git
  branch: master
  message: "site update: {{ now('YYYY-MM-DD HH:mm') }}"

# mermaid
mermaid_disabled_for_test:
  enable: false
mermaid:
  enable: true
  version: "11.4.0"
  options:
    theme: default
    startOnLoad: true
    flowchart:
      useMaxWidth: true
      htmlLabels: true
    sequence:
      useMaxWidth: true
    gantt:
      useMaxWidth: true

# Live2D
live2d:
  enable: true
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  debug: false
  model:
    jsonPath: /live2dw/assets/haruto.model.json
  display:
    position: left
    width: 100
    height: 200
  mobile:
    show: true
  react:
    opacity: 0.7
  wifes:
    - kanna
    - tororo
    - tsundere
    - urusulap

# Search
search:
  path: search.xml
  field: post
  content: true
  format: html
